<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">SkeletonPackages.jl workflow pipeline with setup step</title>
  <desc id="desc">A teacher starts with a scaffolded assignment setup, edits a reference package, generates a student skeleton, receives a student submission, and grades it to produce feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2933" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1120" height="260" rx="0" fill="#f7fafc"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="28" y="76" width="176" height="96" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
      <rect x="254" y="76" width="176" height="96" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
      <rect x="480" y="76" width="176" height="96" rx="8" fill="#ffffff" stroke="#49a078" stroke-width="2"/>
      <rect x="706" y="76" width="176" height="96" rx="8" fill="#ffffff" stroke="#f2a65a" stroke-width="2"/>
      <rect x="932" y="76" width="160" height="96" rx="8" fill="#ffffff" stroke="#8357c5" stroke-width="2"/>
    </g>
    <text x="116" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#607d8b">Step 0</text>
    <text x="116" y="132" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Setup</text>
    <text x="116" y="154" text-anchor="middle" font-size="13" fill="#465866">teacher scaffold</text>

    <text x="342" y="109" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">X.jl</text>
    <text x="342" y="135" text-anchor="middle" font-size="14" fill="#465866">teacher reference</text>
    <text x="342" y="154" text-anchor="middle" font-size="12" fill="#6b7c88">solutions and hidden tests</text>

    <text x="568" y="109" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Y.jl</text>
    <text x="568" y="135" text-anchor="middle" font-size="14" fill="#465866">student skeleton</text>
    <text x="568" y="154" text-anchor="middle" font-size="12" fill="#6b7c88">RUBRIC.md + AGENTS.md</text>

    <text x="794" y="109" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Z.jl</text>
    <text x="794" y="135" text-anchor="middle" font-size="14" fill="#465866">student submission</text>

    <text x="1012" y="109" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Report</text>
    <text x="1012" y="135" text-anchor="middle" font-size="14" fill="#465866">feedback and grade</text>

    <path d="M 214 124 H 244" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 440 124 H 470" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 666 124 H 696" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 892 124 H 922" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <text x="229" y="88" text-anchor="middle" font-size="12" fill="#2f4858">teacher edits</text>
    <text x="455" y="88" text-anchor="middle" font-size="12" fill="#2f4858">generate_skeleton_package(...)</text>
    <text x="681" y="88" text-anchor="middle" font-size="12" fill="#2f4858">student completes</text>
    <text x="907" y="88" text-anchor="middle" font-size="12" fill="#2f4858">grade_submission(...)</text>

    <text x="116" y="207" text-anchor="middle" font-size="13" fill="#2f4858">create_assignment(...)</text>
    <text x="116" y="226" text-anchor="middle" font-size="12" fill="#6b7c88">examples, config, notes</text>
  </g>
</svg>
