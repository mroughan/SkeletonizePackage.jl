<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="1280"
   height="430"
   viewBox="0 0 1280 430"
   version="1.1"
   id="workflow-pipeline-svg"
   role="img"
   aria-labelledby="workflow-pipeline-title workflow-pipeline-desc"
   sodipodi:docname="workflow-pipeline.svg"
   inkscape:version="1.3">
  <title id="workflow-pipeline-title">SkeletonizePackage.jl full workflow pipeline</title>
  <desc id="workflow-pipeline-desc">Full pipeline from teacher setup, to an iterative reference validation loop, then skeleton package, student submission, grading, and reporting.</desc>
  <metadata id="metadata-workflow-pipeline">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>SkeletonizePackage.jl full workflow pipeline</dc:title>
        <dc:format>image/svg+xml</dc:format>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <sodipodi:namedview
     id="namedview-workflow-pipeline"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1"
     inkscape:pageopacity="0"
     inkscape:pageshadow="2"
     inkscape:document-units="px"
     showgrid="false" />
  <defs id="defs-workflow-pipeline">
    <marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858" id="workflow-arrow-path" />
    </marker>
  </defs>
  <rect id="workflow-background" width="1280" height="430" fill="#f7fafc" />
  <g id="workflow-content" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text id="workflow-heading" x="640" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#17212b">SkeletonizePackage.jl Pipeline</text>
    <text id="workflow-subheading" x="640" y="68" text-anchor="middle" font-size="14" fill="#465866">teacher reference package to student skeleton to submission grading and reports</text>

    <g id="workflow-card-shadows" opacity="0.12">
      <rect x="28" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="208" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="428" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="648" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="868" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="1088" y="118" width="150" height="112" rx="8" fill="#1f2933" />
      <rect x="208" y="264" width="150" height="82" rx="8" fill="#1f2933" />
    </g>
    <g id="workflow-cards">
      <rect id="step-0-card" x="24" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2" />
      <rect id="step-1-card" x="204" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2" />
      <rect id="step-2-card" x="204" y="260" width="150" height="82" rx="8" fill="#ffffff" stroke="#4f6f7a" stroke-width="2" />
      <rect id="step-3-card" x="424" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#49a078" stroke-width="2" />
      <rect id="step-4-card" x="644" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#f2a65a" stroke-width="2" />
      <rect id="step-5-card" x="864" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#8357c5" stroke-width="2" />
      <rect id="step-6-card" x="1084" y="114" width="150" height="112" rx="8" fill="#ffffff" stroke="#2d7f7b" stroke-width="2" />
    </g>

    <g id="step-0-text">
      <text x="99" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#607d8b">Step 0</text>
      <text x="99" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Setup</text>
      <text x="99" y="187" text-anchor="middle" font-size="12" fill="#465866">create_assignment</text>
      <text x="99" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">config and examples</text>
    </g>
    <g id="step-1-text">
      <text x="279" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#5b8def">Step 1</text>
      <text x="279" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Reference</text>
      <text x="279" y="187" text-anchor="middle" font-size="12" fill="#465866">teacher package</text>
      <text x="279" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">solutions and tests</text>
    </g>
    <g id="step-2-text">
      <text x="279" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#4f6f7a">Step 2</text>
      <text x="279" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Validate</text>
      <text x="279" y="329" text-anchor="middle" font-size="12" fill="#465866">syntax + design</text>
    </g>
    <g id="step-3-text">
      <text x="499" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#49a078">Step 3</text>
      <text x="499" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Skeleton</text>
      <text x="499" y="187" text-anchor="middle" font-size="12" fill="#465866">student package</text>
      <text x="499" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">RUBRIC + AGENTS</text>
    </g>
    <g id="step-4-text">
      <text x="719" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#c57b28">Step 4</text>
      <text x="719" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Submission</text>
      <text x="719" y="187" text-anchor="middle" font-size="12" fill="#465866">student completes</text>
      <text x="719" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">same assignment API</text>
    </g>
    <g id="step-5-text">
      <text x="939" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#8357c5">Step 5</text>
      <text x="939" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Grade</text>
      <text x="939" y="187" text-anchor="middle" font-size="12" fill="#465866">public + hidden</text>
      <text x="939" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">reference checks</text>
    </g>
    <g id="step-6-text">
      <text x="1159" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#2d7f7b">Step 6</text>
      <text x="1159" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Reports</text>
      <text x="1159" y="187" text-anchor="middle" font-size="12" fill="#465866">feedback markdown</text>
      <text x="1159" y="205" text-anchor="middle" font-size="12" fill="#6b7c88">marks CSV row</text>
    </g>

    <path id="arrow-0-1" d="M 184 170 H 194" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-1-3" d="M 364 170 H 414" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-3-4" d="M 584 170 H 634" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-4-5" d="M 804 170 H 854" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-5-6" d="M 1024 170 H 1074" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-reference-validate" d="M 279 236 V 250" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />
    <path id="arrow-validate-reference" d="M 204 301 C 154 301 154 238 194 228" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#workflow-arrow)" />

    <text id="flow-0-1" x="189" y="106" text-anchor="middle" font-size="11" fill="#2f4858">edit</text>
    <text id="flow-1-3" x="389" y="106" text-anchor="middle" font-size="11" fill="#2f4858">generate after checks</text>
    <text id="flow-3-4" x="609" y="106" text-anchor="middle" font-size="11" fill="#2f4858">complete</text>
    <text id="flow-4-5" x="829" y="106" text-anchor="middle" font-size="11" fill="#2f4858">assess</text>
    <text id="flow-5-6" x="1049" y="106" text-anchor="middle" font-size="11" fill="#2f4858">summarise</text>
    <text id="flow-reference-validate" x="302" y="247" text-anchor="start" font-size="11" fill="#2f4858">check</text>
    <text id="flow-validate-reference" x="150" y="277" text-anchor="middle" font-size="11" fill="#2f4858">fix and rerun</text>

    <g id="workflow-output-shadows" opacity="0.10">
      <rect x="212" y="360" width="326" height="54" rx="8" fill="#1f2933" />
      <rect x="570" y="360" width="326" height="54" rx="8" fill="#1f2933" />
      <rect x="928" y="360" width="326" height="54" rx="8" fill="#1f2933" />
    </g>
    <g id="workflow-outputs">
      <rect id="teacher-artifacts-box" x="208" y="356" width="326" height="54" rx="8" fill="#eef4ff" stroke="#5b8def" stroke-width="1.5" />
      <text x="371" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#17212b">reference artifacts</text>
      <text x="371" y="399" text-anchor="middle" font-size="12" fill="#465866">@solution, @hidden_test, requirements, INC config</text>
      <rect id="student-artifacts-box" x="566" y="356" width="326" height="54" rx="8" fill="#eaf8f0" stroke="#49a078" stroke-width="1.5" />
      <text x="729" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#17212b">student artifacts</text>
      <text x="729" y="399" text-anchor="middle" font-size="12" fill="#465866">@scaffolding, public tests, RUBRIC.md, AGENTS.md</text>
      <rect id="grading-artifacts-box" x="924" y="356" width="326" height="54" rx="8" fill="#f3edff" stroke="#8357c5" stroke-width="1.5" />
      <text x="1087" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#17212b">grading artifacts</text>
      <text x="1087" y="399" text-anchor="middle" font-size="12" fill="#465866">student feedback report and category marks CSV</text>
    </g>
  </g>
</svg>
