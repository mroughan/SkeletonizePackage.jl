<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">SkeletonPackages.jl workflow pipeline</title>
  <desc id="desc">A teacher reference package is transformed into a student starter package, completed by the student, and graded to produce feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2933" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="920" height="250" rx="0" fill="#f7fafc"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="34" y="72" width="172" height="92" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2"/>
      <rect x="259" y="72" width="172" height="92" rx="8" fill="#ffffff" stroke="#49a078" stroke-width="2"/>
      <rect x="484" y="72" width="172" height="92" rx="8" fill="#ffffff" stroke="#f2a65a" stroke-width="2"/>
      <rect x="709" y="72" width="172" height="92" rx="8" fill="#ffffff" stroke="#8357c5" stroke-width="2"/>
    </g>
    <text x="120" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">X.jl</text>
    <text x="120" y="137" text-anchor="middle" font-size="14" fill="#465866">teacher reference</text>
    <text x="345" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Y.jl</text>
    <text x="345" y="137" text-anchor="middle" font-size="14" fill="#465866">student starter</text>
    <text x="570" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Z.jl</text>
    <text x="570" y="137" text-anchor="middle" font-size="14" fill="#465866">student submission</text>
    <text x="795" y="111" text-anchor="middle" font-size="20" font-weight="700" fill="#17212b">Report</text>
    <text x="795" y="137" text-anchor="middle" font-size="14" fill="#465866">feedback and grade</text>
    <path d="M 216 118 H 248" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 441 118 H 473" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M 666 118 H 698" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="232" y="88" text-anchor="middle" font-size="13" fill="#2f4858">generate_student_package(...)</text>
    <text x="457" y="88" text-anchor="middle" font-size="13" fill="#2f4858">student completes</text>
    <text x="682" y="88" text-anchor="middle" font-size="13" fill="#2f4858">grade_submission(...)</text>
  </g>
</svg>
