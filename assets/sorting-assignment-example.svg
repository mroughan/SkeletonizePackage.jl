<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   width="1120"
   height="620"
   viewBox="0 0 1120 620"
   version="1.1"
   id="sorting-assignment-example-svg"
   role="img"
   aria-labelledby="sorting-example-title sorting-example-desc"
   sodipodi:docname="sorting-assignment-example.svg"
   inkscape:version="1.3">
  <title id="sorting-example-title">SortingAssignment pipeline example</title>
  <desc id="sorting-example-desc">A detailed SortingAssignment example showing how annotated reference code becomes a skeleton package, how the student submission is graded, and what reports are produced.</desc>
  <metadata id="metadata-sorting-example">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>SortingAssignment pipeline example</dc:title>
        <dc:format>image/svg+xml</dc:format>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <sodipodi:namedview
     id="namedview-sorting-example"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1"
     inkscape:pageopacity="0"
     inkscape:pageshadow="2"
     inkscape:document-units="px"
     showgrid="false" />
  <defs id="defs-sorting-example">
    <marker id="sorting-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path id="sorting-arrow-path" d="M 0 0 L 10 5 L 0 10 z" fill="#2f4858" />
    </marker>
  </defs>
  <rect id="sorting-background" width="1120" height="620" fill="#f7fafc" />
  <g id="sorting-content" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text id="sorting-title" x="560" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#17212b">SortingAssignment Example</text>
    <text id="sorting-subtitle" x="560" y="61" text-anchor="middle" font-size="13" fill="#465866">reference annotations become a skeleton; the completed submission is graded against public, hidden, and reference checks</text>

    <g id="sorting-main-card-shadows" opacity="0.11">
      <rect x="38" y="96" width="296" height="368" rx="8" fill="#1f2933" />
      <rect x="418" y="96" width="296" height="368" rx="8" fill="#1f2933" />
      <rect x="794" y="96" width="296" height="368" rx="8" fill="#1f2933" />
    </g>
    <g id="sorting-main-cards">
      <rect id="reference-example-card" x="34" y="92" width="296" height="368" rx="8" fill="#ffffff" stroke="#5b8def" stroke-width="2" />
      <rect id="skeleton-example-card" x="414" y="92" width="296" height="368" rx="8" fill="#ffffff" stroke="#49a078" stroke-width="2" />
      <rect id="submission-example-card" x="790" y="92" width="296" height="368" rx="8" fill="#ffffff" stroke="#f2a65a" stroke-width="2" />
    </g>

    <text x="182" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Teacher reference</text>
    <text x="562" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Generated skeleton</text>
    <text x="938" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#17212b">Student submission</text>

    <path id="reference-to-skeleton" d="M 342 276 H 402" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#sorting-arrow)" />
    <path id="skeleton-to-submission" d="M 722 276 H 778" stroke="#2f4858" stroke-width="3" fill="none" marker-end="url(#sorting-arrow)" />
    <text x="372" y="250" text-anchor="middle" font-size="12" fill="#2f4858">generate</text>
    <text x="750" y="250" text-anchor="middle" font-size="12" fill="#2f4858">complete</text>

    <g id="reference-source-panel">
      <rect x="58" y="150" width="248" height="142" rx="6" fill="#eef4ff" />
      <text x="74" y="174" font-size="13" fill="#465866">src/SortingAssignment.jl</text>
      <text x="74" y="202" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">function mysort(xs)</text>
      <text x="92" y="225" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">@solution begin</text>
      <text x="110" y="248" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">return sort(xs)</text>
      <text x="92" y="271" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">@scaffolding begin</text>
    </g>
    <g id="reference-tests-panel">
      <rect x="58" y="306" width="248" height="124" rx="6" fill="#fff8ec" />
      <text x="74" y="330" font-size="13" fill="#465866">test/runtests.jl</text>
      <text x="74" y="358" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">@student_test sort([2, 1])</text>
      <text x="74" y="382" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">@hidden_test empty input</text>
      <text x="74" y="406" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">@reference_test random lists</text>
    </g>

    <g id="skeleton-source-panel">
      <rect x="438" y="150" width="248" height="142" rx="6" fill="#eaf8f0" />
      <text x="454" y="174" font-size="13" fill="#465866">src/SortingAssignment.jl</text>
      <text x="454" y="202" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">function mysort(xs)</text>
      <text x="472" y="225" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">error("TODO")</text>
      <text x="454" y="248" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">end</text>
      <text x="454" y="274" font-size="13" fill="#465866">solution removed; scaffolding kept</text>
    </g>
    <g id="skeleton-support-panel">
      <rect x="438" y="306" width="248" height="124" rx="6" fill="#edf7f7" />
      <text x="454" y="330" font-size="13" fill="#465866">student-facing files</text>
      <text x="454" y="358" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">public tests</text>
      <text x="454" y="382" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">RUBRIC.md</text>
      <text x="454" y="406" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">AGENTS.md policy</text>
    </g>

    <g id="submission-source-panel">
      <rect x="814" y="150" width="248" height="142" rx="6" fill="#fff5e8" />
      <text x="830" y="174" font-size="13" fill="#465866">student implementation</text>
      <text x="830" y="202" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">function mysort(xs)</text>
      <text x="848" y="225" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b"># student code</text>
      <text x="848" y="248" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">return sorted</text>
      <text x="830" y="271" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">end</text>
    </g>
    <g id="submission-grade-panel">
      <rect x="814" y="306" width="248" height="124" rx="6" fill="#f3edff" />
      <text x="830" y="330" font-size="13" fill="#465866">grade_submission(...)</text>
      <text x="830" y="358" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">public tests: pass/fail</text>
      <text x="830" y="382" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">hidden tests: pass/fail</text>
      <text x="830" y="406" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#17212b">reference comparison</text>
    </g>

    <g id="sorting-bottom-shadows" opacity="0.10">
      <rect x="218" y="504" width="296" height="68" rx="8" fill="#1f2933" />
      <rect x="614" y="504" width="296" height="68" rx="8" fill="#1f2933" />
    </g>
    <g id="sorting-bottom-row">
      <rect id="feedback-output-card" x="214" y="500" width="296" height="68" rx="8" fill="#ffffff" stroke="#2d7f7b" stroke-width="2" />
      <rect id="csv-output-card" x="610" y="500" width="296" height="68" rx="8" fill="#ffffff" stroke="#8357c5" stroke-width="2" />
    </g>
    <path id="submission-to-feedback" d="M 908 462 C 848 492 590 492 514 522" stroke="#2f4858" stroke-width="2.5" fill="none" marker-end="url(#sorting-arrow)" />
    <path id="submission-to-csv" d="M 968 462 C 952 492 914 504 910 522" stroke="#2f4858" stroke-width="2.5" fill="none" marker-end="url(#sorting-arrow)" />
    <text x="362" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#17212b">student feedback report</text>
    <text x="362" y="548" text-anchor="middle" font-size="12" fill="#465866">rubric-linked explanations and marks</text>
    <text x="758" y="526" text-anchor="middle" font-size="16" font-weight="700" fill="#17212b">marks CSV row</text>
    <text x="758" y="548" text-anchor="middle" font-size="12" fill="#465866">category totals and assignment total</text>
  </g>
</svg>
