name: Aqua

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  aqua:
    name: Aqua - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Run Aqua quality checks
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(joinpath("test", "quality"))
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "aqua.jl"))
