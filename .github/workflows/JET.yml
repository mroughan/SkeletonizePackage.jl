name: JET

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  jet:
    name: JET - Julia 1.12 - ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Run JET static analysis
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("test")
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
          include(joinpath(pwd(), "test", "jet.jl"))
